# ── JVM Heap ──────────────────────────────────────────────────────────────────
# AGP 9 + R8 full-mode + ML Kit dependencies need substantial heap.
# 8 GB heap, 4 GB metaspace, and 512 MB code cache cover the worst case on CI.
org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError

# ── AndroidX ──────────────────────────────────────────────────────────────────
android.useAndroidX=true

# ── Removed flags ─────────────────────────────────────────────────────────────
# android.newDsl=false     → removed: AGP 9 requires new DSL (KTS); this flag
#                            caused "Unrecognized Gradle property" warnings and
#                            would break the build on AGP 10.
# android.builtInKotlin=false → removed: AGP 9 manages Kotlin internally;
#                                setting this to false triggers a deprecation
#                                error in AGP 9 and is removed in AGP 10.
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
